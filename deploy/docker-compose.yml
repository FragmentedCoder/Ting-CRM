services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      # Another port only for a second stack beside this one, such as the browser
      # tests' (frontend/e2e/run.sh); TING_ADDRESS must then carry it too.
      - "${TING_HTTPS_PORT:-443}:${TING_HTTPS_PORT:-443}"
    environment:
      TING_ADDRESS: ${TING_ADDRESS:-https://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The TLS settings (and an uploaded certificate) the app writes.
      - ting_tls:/etc/caddy/ting:ro
    depends_on:
      - app

  app:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the ting command.
        TING_VERSION: ${TING_VERSION:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TING_ADDRESS: ${TING_ADDRESS:-https://localhost}
      TING_DATA_DIR: /data
      TING_MASTER_KEY_PATH: /etc/ting/master.key
    volumes:
      - ting_data:/data
      - ${TING_ETC:-/etc/ting}:/etc/ting:ro
      - ting_tls:/tls

  # The background worker: backups, the audit log's daily timestamp, email. The
  # same image and limits as the app, without a port.
  worker:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the ting command.
        TING_VERSION: ${TING_VERSION:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "app.worker"]
    environment:
      TING_ADDRESS: ${TING_ADDRESS:-https://localhost}
      TING_DATA_DIR: /data
      TING_MASTER_KEY_PATH: /etc/ting/master.key
    volumes:
      - ting_data:/data
      - ${TING_ETC:-/etc/ting}:/etc/ting:ro
      # Backups kept on this server: a volume by default, or a folder on the host
      # (owned by UID 10001) when TING_BACKUP_DIR names one, such as a mounted disk.
      - ${TING_BACKUP_DIR:-ting_backups}:/backups
    depends_on:
      - app

  # For the ting command, never started with the others: what has to write to
  # the master key's folder (rotating the key) or work on the data while the app
  # is stopped (copying it aside before an update). The same image and limits.
  tools:
    build:
      context: ../backend
      args:
        # What the build calls itself: set by the installer and the ting command.
        TING_VERSION: ${TING_VERSION:-}
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TING_ADDRESS: ${TING_ADDRESS:-https://localhost}
      TING_DATA_DIR: /data
      TING_MASTER_KEY_PATH: /etc/ting/master.key
    volumes:
      - ting_data:/data
      - ${TING_ETC:-/etc/ting}:/etc/ting
      - ${TING_BACKUP_DIR:-ting_backups}:/backups

volumes:
  caddy_data:
  caddy_config:
  ting_data:
  ting_backups:
  ting_tls:
