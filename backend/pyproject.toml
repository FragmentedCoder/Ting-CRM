[project]
name = "ting-backend"
version = "0.1.0"
description = "Þing API and background worker"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.38,<0.39",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "sqlcipher3-binary>=0.6,<0.7",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50,<51",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.11,<3",
  "httpx>=0.28,<0.29",
  "pyotp>=2.10,<2.11",
  "webauthn>=3.0,<3.1",
  "pillow>=13.0,<13.1",
  # RFC 3161 timestamps (the audit log's daily stamp); report signing later.
  "pyhanko>=0.38,<0.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.14,<0.15",
  "mypy>=1.19,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = "sqlcipher3"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
