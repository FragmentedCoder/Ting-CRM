name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "install.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: pip install .[dev]
      # The backup tests run restic itself against a local repository: the version the
      # app image has (Ubuntu 24.04's 0.16 lacks the exit codes Þing reads), pinned to
      # the SHA-256 in restic's signed checksum list (key CF8F18F2844575973F79D4E191A6868BD3F7A907).
      - name: Install restic
        env:
          RESTIC_VERSION: "0.18.0"
          RESTIC_SHA256: 98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e
        run: |
          curl -fsSLo /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 -c /tmp/restic.bz2 >/tmp/restic
          sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          restic version
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest
      - name: Audit the dependencies for known vulnerabilities
        run: pip install pip-audit && pip-audit --progress-spinner off

  frontend:
    name: Frontend lint, type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit the dependencies for known vulnerabilities
        run: npm audit --audit-level=high

  deploy:
    name: Installer and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # ShellCheck comes with the runner image.
      - name: Lint the shell scripts
        run: shellcheck -x install.sh deploy/*.sh deploy/ting frontend/e2e/run.sh
      - name: Lint the workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color=false
      - name: Test the installer's functions
        run: deploy/install.test.sh
      - name: Test the ting command's own logic
        run: deploy/ting.test.sh
      - name: Test the release's compose file
        run: python3 deploy/release-compose.test.py

  browser:
    name: Browser tests against the full stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway master key, in the browser tests' own folder
        run: |
          sudo install -d -o 10001 -g 10001 -m 0700 /etc/ting-e2e /etc/ting-e2e/keys
          sudo sh -c 'head -c 32 /dev/urandom > /etc/ting-e2e/master.key'
          sudo chown 10001:10001 /etc/ting-e2e/master.key
          sudo chmod 0600 /etc/ting-e2e/master.key
      - name: Run Playwright against Caddy, the app and its database
        run: frontend/e2e/run.sh
      # The images the browser tests ran: high and critical vulnerabilities with a fix
      # released fail the check.
      - name: Scan the images for known vulnerabilities
        run: |
          for image in ting-e2e-app ting-e2e-caddy; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.75.0 image --quiet --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Keep screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/e2e-results/
          if-no-files-found: ignore
