name: Bug report
description: Something in Þing does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not use this form — report it privately as described in SECURITY.md.
        Never paste real customer data, passwords or keys into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Þing version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hypervisor, Ubuntu version, browser, anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs app worker caddy`, run in the folder with Þing's docker-compose.yml, with anything sensitive removed.
      render: text
