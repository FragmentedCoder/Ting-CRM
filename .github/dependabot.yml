# Weekly pull requests for dependencies with newer versions; the CI audit and
# image scan catch the ones with known vulnerabilities in between.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /deploy]
    schedule:
      interval: weekly
    ignore:
      # The database driver (sqlcipher3-binary) ships a build for each Python version, and
      # has none for 3.15 yet, so the backend image can't be built on it. Take this out when
      # https://pypi.org/project/sqlcipher3-binary/#files lists cp315.
      - dependency-name: python
        versions: [">= 3.15, < 3.16"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
